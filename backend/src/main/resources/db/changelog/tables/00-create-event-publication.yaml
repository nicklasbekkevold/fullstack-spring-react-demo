databaseChangeLog:
  - changeSet:
      id: 20261005-create-event-publication-table
      author: generator
      changes:
        - createTable:
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: completion_date
                  type: timestamp with time zone
              - column:
                  name: event_type
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: listener_id
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: varchar(4000)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
              - column:
                  name: completion_attempts
                  type: int
              - column:
                  name: last_resubmission_date
                  type: timestamp with time zone

        - createIndex:
            indexName: event_publication_by_listener_id_and_serialized_event_idx
            tableName: event_publication
            columns:
              - column:
                  name: listener_id
              - column:
                  name: serialized_event

        - createIndex:
            indexName: event_publication_by_completion_date_idx
            tableName: event_publication
            columns:
              - column:
                  name: completion_date