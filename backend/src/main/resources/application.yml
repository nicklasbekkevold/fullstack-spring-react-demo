spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=users;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  show-actuator: true
  default-produces-media-type: application/json