spring:
  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=user;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  show-actuator: true
  default-produces-media-type: application/json